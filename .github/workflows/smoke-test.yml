name: Smoke test

# Boots an x86_64 emulator, installs the debug APK, launches MainActivity,
# waits a few seconds, and dumps logcat. Fails if any FATAL EXCEPTION /
# AndroidRuntime error is logged in the package's PID — meaning the app
# crashed at startup. Use this when on-device dogfood reports "app stopped"
# and you don't have adb access to the phone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest

    # Emulator runner needs KVM, which the standard ubuntu-latest image
    # provides via /dev/kvm. The matrix is just for documentation — single
    # API level keeps wall time down.
    strategy:
      matrix:
        api-level: [34]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD warm-up complete"

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Write every interesting state into /tmp/smoke-verdict.log
            # explicitly. No exec/set -x — past attempts to capture shell
            # trace via redirects all came back empty, suggesting the
            # action's wrapper interferes. Plain `echo … >> file` works.
            LOG=/tmp/smoke-verdict.log
            : > "$LOG"
            echo "=== smoke run start $(date -u) ===" >> "$LOG"

            set +e
            adb wait-for-device
            echo "STAGE: device ready, rc=$?" >> "$LOG"

            adb shell input keyevent 82 || true

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo "STAGE: install rc=$?" >> "$LOG"

            adb logcat -c
            echo "STAGE: logcat cleared, rc=$?" >> "$LOG"

            adb shell am start -W -n cz.netbite.sshpal/.MainActivity
            START_RC=$?
            echo "STAGE: am start rc=$START_RC" >> "$LOG"

            sleep 10
            echo "STAGE: 10s sleep done" >> "$LOG"

            adb logcat -d > /tmp/logcat-full.txt
            echo "STAGE: logcat dumped, lines=$(wc -l < /tmp/logcat-full.txt)" >> "$LOG"

            adb shell run-as cz.netbite.sshpal cat files/crash.log >> "$LOG" 2>/dev/null
            echo "STAGE: crash.log read attempted" >> "$LOG"

            CRASHED=0
            FATAL_HITS=$(grep -cE "FATAL EXCEPTION|signal 11" /tmp/logcat-full.txt)
            AR_HITS=$(grep -cE "AndroidRuntime.*cz\\.netbite\\.sshpal" /tmp/logcat-full.txt)
            DISPLAYED_HITS=$(grep -c "Displayed cz.netbite.sshpal" /tmp/logcat-full.txt)
            echo "GREP: FATAL=$FATAL_HITS AR=$AR_HITS DISPLAYED=$DISPLAYED_HITS" >> "$LOG"

            if [ "$FATAL_HITS" -gt 0 ]; then CRASHED=1; echo "FAIL: FATAL EXCEPTION present" >> "$LOG"; fi
            if [ "$AR_HITS" -gt 0 ]; then CRASHED=1; echo "FAIL: AndroidRuntime for our package" >> "$LOG"; fi
            if [ "$DISPLAYED_HITS" -eq 0 ]; then CRASHED=1; echo "FAIL: never reached Displayed" >> "$LOG"; fi

            adb shell ps -A 2>/dev/null | grep -i sshpal >> "$LOG" || echo "(no sshpal in ps)" >> "$LOG"

            echo "VERDICT: CRASHED=$CRASHED $([ $CRASHED -eq 0 ] && echo PASS || echo FAIL)" >> "$LOG"

            if [ "$CRASHED" -ne 0 ]; then
              exit 1
            fi
            echo "Smoke test PASSED"
            exit 0

      - name: Upload full logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-api-${{ matrix.api-level }}
          path: /tmp/logcat-full.txt
          if-no-files-found: warn

      # On failure, also commit the logcat to `ci-logs/` on main so it's
      # reachable via the public git clone — GitHub's artifact + logs API
      # endpoints require auth tokens we don't have on the dev host.
      - name: Publish logcat to repo on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          cp /tmp/logcat-full.txt ci-logs/smoke-${{ github.run_id }}-api${{ matrix.api-level }}.log 2>/dev/null || true
          cp /tmp/smoke-verdict.log ci-logs/smoke-${{ github.run_id }}-api${{ matrix.api-level }}-verdict.log 2>/dev/null || true
          if ls ci-logs/smoke-${{ github.run_id }}-* >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git checkout main
            git add ci-logs/
            git commit -m "ci: smoke test logcat from run ${{ github.run_id }}" || echo "nothing to commit"
            git push origin main
          fi

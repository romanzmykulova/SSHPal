name: Smoke test

# Boots an x86_64 emulator, installs the debug APK, launches MainActivity,
# waits a few seconds, and dumps logcat. Fails if any FATAL EXCEPTION /
# AndroidRuntime error is logged in the package's PID — meaning the app
# crashed at startup. Use this when on-device dogfood reports "app stopped"
# and you don't have adb access to the phone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    # Emulator runner needs KVM, which the standard ubuntu-latest image
    # provides via /dev/kvm. The matrix is just for documentation — single
    # API level keeps wall time down.
    strategy:
      matrix:
        api-level: [34]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD warm-up complete"

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            adb wait-for-device
            adb shell input keyevent 82 || true

            echo "=== Installing APK ==="
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo "=== Clearing logcat buffer ==="
            adb logcat -c

            echo "=== Launching MainActivity ==="
            adb shell am start -W -n cz.netbite.sshpal/.MainActivity
            START_RC=$?
            echo "am start rc=$START_RC"

            echo "=== Letting it settle for 10s ==="
            sleep 10

            echo "=== Dumping full logcat (cz.netbite.sshpal + AndroidRuntime + System) ==="
            adb logcat -d > /tmp/logcat-full.txt
            grep -E "AndroidRuntime|FATAL|cz\\.netbite\\.sshpal|ActivityManager.*sshpal|libc.*sshpal" /tmp/logcat-full.txt > /tmp/logcat-filtered.txt || true
            echo "--- filtered logcat ---"
            cat /tmp/logcat-filtered.txt
            echo "--- end filtered ---"

            echo "=== Pulling crash.log if our own crash logger wrote one ==="
            adb shell run-as cz.netbite.sshpal cat files/crash.log 2>/dev/null || echo "(no crash.log present)"

            echo "=== Checking for crash markers ==="
            CRASHED=0
            if grep -qE "FATAL EXCEPTION|AndroidRuntime.*cz\\.netbite\\.sshpal|signal 11" /tmp/logcat-full.txt; then
              echo "❌ Crash detected in logcat"
              CRASHED=1
            fi
            if ! adb shell pidof cz.netbite.sshpal > /dev/null; then
              echo "❌ App process is not running 10s after launch"
              CRASHED=1
            else
              echo "✅ App process is alive"
            fi
            exit $CRASHED

      - name: Upload full logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-api-${{ matrix.api-level }}
          path: /tmp/logcat-full.txt
          if-no-files-found: warn
